jobs:
  - kernel_include_regex: ".*moe_2stage_down_prefill_1x4_0.*"
    kernel_iteration_range: "[1, [5-5]]"
    output_file: out
    output_directory: /tmp/moe-unified8-att
    output_format: [csv]
    truncate_kernels: true
    sys_trace: true
    advanced_thread_trace: true
    att_target_cu: 1
    att_shader_engine_mask: "0xf"
    att_simd_select: "0xf"
    att_buffer_size: "0x60000000"
